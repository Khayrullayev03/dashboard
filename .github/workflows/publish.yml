# Публикация сайта: каждое изменение в ветке main копируется в ветку gh-pages,
# из которой GitHub Pages показывает сайт https://khayrullayev03.github.io/dashboard/
name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: main → gh-pages
        run: git push --force origin HEAD:gh-pages
