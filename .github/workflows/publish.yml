name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Up to date?
        id: check
        run: |
          built="$(git log -1 --format=%s origin/gh-pages 2>/dev/null || true)"
          if [ "$built" = "build $(git rev-parse --short=7 HEAD)" ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi
      - name: Minify
        if: steps.check.outputs.skip != 'true'
        run: |
          npx --yes esbuild@0.24.0 assets/js/*.js --minify --outdir=assets/js --allow-overwrite --log-level=warning
          npx --yes esbuild@0.24.0 assets/css/style.css --minify --outfile=assets/css/style.css --allow-overwrite --log-level=warning
      - name: main → gh-pages
        if: steps.check.outputs.skip != 'true'
        run: |
          v="$(git rev-parse --short=7 HEAD)"
          sed -i "s/?v=dev/?v=$v/g" index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "build $v"
          git push --force origin HEAD:gh-pages
